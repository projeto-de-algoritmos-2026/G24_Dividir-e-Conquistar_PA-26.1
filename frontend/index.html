<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Teste de Afinidade Musical — Descubra o quão parecido é o seu gosto musical usando o algoritmo de Contagem de Inversões (Merge Sort / Divisão e Conquista).">
  <title>🎵 Teste de Afinidade Musical — Counting Inversions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stickers" aria-hidden="true">
    <img src="./assets/imgs/hellokitty.svg" class="sticker s1">
    <img src="./assets/imgs/kawaisun.svg" class="sticker s2">
    <img src="./assets/imgs/snoopy-love.svg" class="sticker s3">
    <img src="./assets/imgs/PinkPantheress_sig.svg.png" class="sticker s4">
  </div>
  
  <div id="app">
    <!-- ─── RANKING BUILDER ─── -->
    <section id="ranking-section" class="section">
      <div class="ranking-container">
        <div class="ranking-header">
          <h1>Monte o seu <span class="gradient-text">Ranking</span></h1>
          <p>Clique nas músicas na ordem da sua preferência — da <strong>favorita</strong> para a <strong>menos favorita</strong>.</p>
          <div class="progress-bar-container">
            <div id="progress-bar" class="progress-bar" style="width: 0%"></div>
          </div>
          <span id="progress-label" class="progress-label">0 / 8 selecionadas</span>
        </div>

        <div class="ranking-panels">
          <!-- Available songs -->
          <div class="panel panel-available">
            <h3 class="panel-title">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
              Músicas Disponíveis
            </h3>
            <div id="available-songs" class="song-list"></div>
          </div>

          <!-- User ranking -->
          <div class="panel panel-ranking">
            <h3 class="panel-title">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="12 2 15 8.5 22 9.3 17 14 18.2 21 12 17.8 5.8 21 7 14 2 9.3 9 8.5"/></svg>
              Seu Ranking
            </h3>
            <div id="user-ranking" class="song-list ranking-list">
              <div class="ranking-placeholder" id="ranking-placeholder">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                <span>Clique nas músicas ao lado para montar o seu ranking</span>
              </div>
            </div>
          </div>
        </div>

        <div class="ranking-actions">
          <button id="btn-reset" class="btn-secondary" onclick="resetRanking()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
            Recomeçar
          </button>
          <button id="btn-calculate" class="btn-primary disabled" onclick="calculateAffinity()" disabled>
            <span>Calcular Afinidade</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          </button>
        </div>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
